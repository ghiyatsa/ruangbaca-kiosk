name: build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Membuktikan aplikasi benar-benar dapat dibangun sebagai rilis Windows,
  # bukan sekadar lolos analisis statis.
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Verify Release Artifacts
        shell: bash
        run: |
          set -euo pipefail
          release="build/windows/x64/runner/Release"
          test -f "$release/ruangbaca_kiosk.exe" || { echo "exe tidak ditemukan"; exit 1; }
          test -d "$release/data" || { echo "folder data tidak ditemukan"; exit 1; }
          ls -la "$release"

name: release-assets

# Alat cadangan (fallback): melampirkan zip Windows ke rilis yang SUDAH ada.
#
# Alur normal TIDAK memakai workflow ini. Rilis dibuat oleh release-please, dan
# GitHub tidak menjalankan workflow dari event yang disebabkan GITHUB_TOKEN
# (anti-rekursi) — jadi `on: release: published` tidak pernah terpicu oleh
# rilis buatan release-please. Karena itu build + upload aset dilakukan di
# dalam release-please.yml (job `release-assets`).
#
# Workflow ini hanya untuk keadaan darurat, mis. zip gagal terlampir atau perlu
# dibuat ulang untuk rilis lama. Jalankan manual dari tab Actions.
#
# Catatan penting: zip yang dihasilkan TIDAK memuat config/kiosk.json
# (folder config/ tidak pernah dibuat oleh `flutter build`). Jadi memasang
# zip ini ke folder dist TIDAK akan menimpa konfigurasi mesin kiosk.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis tujuan (mis. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: windows-latest
    steps:
      - name: Tentukan tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          test -n "$tag" || { echo "tag kosong"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag rilis: $tag"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Verify Release Artifacts
        shell: bash
        run: |
          set -euo pipefail
          release="build/windows/x64/runner/Release"
          test -f "$release/ruangbaca_kiosk.exe" || { echo "exe tidak ditemukan"; exit 1; }
          test -f "$release/data/app.so" || { echo "data/app.so tidak ditemukan"; exit 1; }
          test -d "$release/data" || { echo "folder data tidak ditemukan"; exit 1; }
          ls -la "$release"

      - name: Paketkan menjadi zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "ruangbaca-kiosk-$tag-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length
          Write-Host "zip dibuat: $zip"

      - name: Lampirkan ke Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          zip="ruangbaca-kiosk-${tag}-windows-x64.zip"
          gh release upload "$tag" "$zip" --clobber
          echo "Terlampir ke rilis $tag:"
          gh release view "$tag" --json assets --jq '.assets[] | "  - \(.name) (\(.size) bytes)"'

name: ruangbaca_kiosk
description: "Aplikasi kiosk mandiri Ruang Baca Informatika (Windows Desktop)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client ke API kiosk Laravel.
  http: ^1.5.0

  # State management ringan (ChangeNotifier).
  provider: ^6.1.5

  # Render QR SVG dari server (claim.qrSvg).
  flutter_svg: ^2.3.0

  # Webcam (opsional) + decode QR dari frame.
  camera: ^0.11.2
  camera_desktop: ^1.1.3
  flutter_zxing: ^3.0.1

  # Mode kiosk: fullscreen, selalu di atas, cegah tutup.
  window_manager: ^0.5.1

  # Format tanggal/waktu id-ID.
  intl: ^0.20.2

  # Idempotency-Key untuk pinjam/kembali.
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
